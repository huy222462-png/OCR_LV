{% extends "base.html" %}
{% block title %}Tra cứu tài liệu{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="mb-1">🔎 Tra cứu tài liệu</h4>
                <div class="text-muted small">Tìm theo số hiệu, từ khóa, loại tài liệu và khoảng ngày ban hành.</div>
            </div>
        </div>

        <form id="searchForm" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Số hiệu</label>
                <input type="text" class="form-control" name="so_hieu" placeholder="VD: 12/QĐ-UBND">
            </div>
            <div class="col-md-3">
                <label class="form-label">Từ khóa</label>
                <input type="text" class="form-control" name="tu_khoa" placeholder="quyết định, công văn...">
            </div>
            <div class="col-md-2">
                <label class="form-label">Từ ngày</label>
                <input type="date" class="form-control" name="tu_ngay">
            </div>
            <div class="col-md-2">
                <label class="form-label">Đến ngày</label>
                <input type="date" class="form-control" name="den_ngay">
            </div>
            <div class="col-md-2">
                <label class="form-label">Loại tài liệu</label>
                <select class="form-select" name="id_loai_tai_lieu">
                    <option value="">Tất cả</option>
                    {% for loai in loai_list %}
                    <option value="{{ loai.id_loai_tai_lieu }}">{{ loai.ten_loai }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Tìm kiếm</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <div id="alertBox" class="alert d-none"></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Số hiệu</th>
                        <th>Ngày ban hành</th>
                        <th>Trích yếu</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr><td colspan="5" class="text-center text-muted">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', initSearchPage);
</script>
{% endblock %}
