{% extends "base.html" %}
{% block title %}Audit Log{% endblock %}

{% block content %}
<h4 class="mb-3">📋 Audit Log hệ thống</h4>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" id="fHanhDong" placeholder="Hành động (VD: TAI_LEN)">
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control form-control-sm" id="fTuNgay">
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control form-control-sm" id="fDenNgay">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary btn-sm w-100" onclick="loadLog(1)">Lọc</button>
            </div>
        </div>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-sm table-hover align-middle">
        <thead class="table-light">
            <tr><th>#</th><th>Người dùng</th><th>Hành động</th><th>Tài liệu</th><th>Thời gian</th><th>Chi tiết</th></tr>
        </thead>
        <tbody id="logBody">
            <tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>
        </tbody>
    </table>
</div>

<nav id="paginationWrap" class="d-flex justify-content-center mt-3"></nav>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function loadLog(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({
        page,
        per_page: 50,
        hanh_dong: document.getElementById('fHanhDong').value.trim(),
        tu_ngay: document.getElementById('fTuNgay').value,
        den_ngay: document.getElementById('fDenNgay').value,
    });
    const r = await fetch('/admin/api/audit-log?' + params);
    const data = await r.json();
    const tbody = document.getElementById('logBody');

    if (!data.items.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không có dữ liệu</td></tr>';
        return;
    }

    tbody.innerHTML = data.items.map(l => `
        <tr>
            <td><small class="text-muted">${l.id_log}</small></td>
            <td>${l.ten_nguoi_dung}</td>
            <td><span class="badge bg-secondary">${l.hanh_dong}</span></td>
            <td>${l.id_tai_lieu > 0 ? `#${l.id_tai_lieu}` : '-'}</td>
            <td><small>${l.thoi_gian_thuc_hien ? l.thoi_gian_thuc_hien.replace('T',' ').slice(0,19) : '-'}</small></td>
            <td>
                <button class="btn btn-outline-secondary btn-sm py-0" onclick='showDetail(${JSON.stringify(l.chi_tiet_thay_doi || "")})'>Xem</button>
            </td>
        </tr>`).join('');

    // Phân trang
    renderPagination(data.page, data.pages);
}

function renderPagination(current, total) {
    const wrap = document.getElementById('paginationWrap');
    if (total <= 1) { wrap.innerHTML = ''; return; }
    let html = '<ul class="pagination pagination-sm">';
    for (let i = 1; i <= total; i++) {
        html += `<li class="page-item ${i === current ? 'active' : ''}">
            <button class="page-link" onclick="loadLog(${i})">${i}</button></li>`;
    }
    html += '</ul>';
    wrap.innerHTML = html;
}

function showDetail(raw) {
    try {
        const obj = typeof raw === 'string' ? JSON.parse(raw) : raw;
        alert(JSON.stringify(obj, null, 2));
    } catch {
        alert(raw || '(trống)');
    }
}

document.addEventListener('DOMContentLoaded', () => loadLog(1));
</script>
{% endblock %}
