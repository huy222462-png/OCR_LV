worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 15M;   # Phải >= MAX_CONTENT_LENGTH Flask

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream Flask/Gunicorn
    upstream flask_app {
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;          # Thay bằng domain thật nếu có

        # Redirect HTTP → HTTPS khi có SSL cert
        # return 301 https://$host$request_uri;

        # ── Static files — phục vụ trực tiếp từ Nginx ──────────────────
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Media files (ảnh upload) ─────────────────────────────────────
        location /media/ {
            alias /app/media/uploads/;
            expires 1d;
            # Chặn truy cập nếu không có session — bảo mật bằng Flask route
            # Để đơn giản, dùng Flask send_file; Nginx chỉ phục vụ nếu bạn bật
            # X-Accel-Redirect trong Flask.
        }

        # ── Proxy đến Flask ───────────────────────────────────────────────
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # Đủ cho OCR đồng bộ fallback
        }
    }

    # ── HTTPS (bỏ comment khi có cert) ───────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /static/ { alias /app/static/; expires 7d; }
    #     location / {
    #         proxy_pass http://flask_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 120s;
    #     }
    # }
}
