services:

  # ── Flask Web App ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      target: runtime
    container_name: ocr_web
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOME=/app
    volumes:
      - media_uploads:/app/media/uploads
      - ./vncorenlp:/app/vncorenlp:ro   # mount JAR + models nếu có
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ocr_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      target: runtime
    container_name: ocr_celery
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOME=/app
    command: >
      celery -A celery_worker.celery worker
      --loglevel=info
      --concurrency=2
      --queues=celery
    volumes:
      - media_uploads:/app/media/uploads
      - ./vncorenlp:/app/vncorenlp:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ocr_net

  # ── Celery Flower (monitor) ───────────────────────────────────────────────
  flower:
    build:
      context: .
      target: runtime
    container_name: ocr_flower
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOME=/app
    command: >
      celery -A celery_worker.celery flower
      --port=5555
      --basic_auth=admin:admin123
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    networks:
      - ocr_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ocr_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ocr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ocr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro       # SSL certs (nếu có)
      - media_uploads:/app/media/uploads:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - ocr_net

volumes:
  redis_data:
  media_uploads:

networks:
  ocr_net:
    driver: bridge
